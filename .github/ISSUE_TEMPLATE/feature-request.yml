name: FEATURE REQUEST
description: Suggest an improvement or new feature for the ZombieBuddy Windows Setup / Repair Helper
title: "[FEATURE] "
labels:
  - enhancement
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement or new feature.
        Please complete the fields below so the idea is clear and easy to evaluate.

  - type: textarea
    id: feature
    attributes:
      label: What would you like to see added or improved?
      description: Describe the feature or improvement.
      placeholder: Explain what you would like to see added or changed...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain what is currently difficult, confusing, repetitive, or missing.
      placeholder: Describe the problem this feature would solve...
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: How should it work?
      description: Describe how you imagine the feature working.
      placeholder: Explain how you think the feature should behave...
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Which part of the helper does this relate to?
      description: Select all that apply.
      options:
        - label: Installation
        - label: Repair
        - label: Diagnostics
        - label: Steam / Workshop detection
        - label: Project Zomboid detection
        - label: B42.21 compatibility patch
        - label: Backups
        - label: Launch option checks
        - label: Diagnostic logs
        - label: Documentation
        - label: Other

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, screenshots, mockups, or other details if helpful.
      placeholder: Add any additional information here...
